findings:
  summary: >-
    Hydro-Québec is the clean negative case for the energy data mandate. It is a
    provincial Crown corporation in a federation where electricity is provincial, so
    the one real North American consumer-energy mandate — Ontario's O. Reg. 633/21
    Green Button requirement — stops at the provincial border and never touches it.
    No mandate, no consumer API, no standard. What it does publish is a genuinely open
    market-data surface: three live API versions over 26 grid, generation, market,
    emissions and hydrology datasets, two of them described by provider-published
    OpenAPI 3.0.3 documents fetched straight from the portal, all callable anonymously
    with zero onboarding. The only friction is a CC BY-NC 4.0 licence that bars
    commercial use — which quietly disqualifies exactly the third-party energy-service
    developers a consumer data right would have been designed to enable.
  status: built
