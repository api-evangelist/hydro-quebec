note: >-
  Hydro-Québec publishes no client library of its own for the open data Explore API. Its public
  GitHub organization (github.com/Hydro-Quebec) exists but has zero public repositories, and the
  only packages under its npm scope (@hydroquebec) are internal SAPUI5 lint/format configs, last
  released in 2022 — not API clients. The maintained client library for this API is the one
  published by Opendatasoft, the platform vendor that actually implements and serves the Explore
  API at donnees.hydroquebec.com; it is recorded here as vendor-official rather than
  provider-first-party. Registries probed: npm, PyPI, Maven Central, NuGet, pkg.go.dev,
  RubyGems, Packagist, crates.io.
