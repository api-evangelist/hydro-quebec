note: >-
  Hydro-Québec publishes no changelog of its own for the open data API. The authoritative
  changelog is the Opendatasoft platform's v2.1 changelog, which the deprecated v2.0 responses
  point clients at directly via a Link; rel="deprecation" header. Entries below are transcribed
  from that page, which is undated — the platform records what changed between versions rather
  than a dated release stream.
