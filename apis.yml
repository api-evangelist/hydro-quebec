- aid: hydro-quebec:hydro-quebec-open-data-search-api-v1
  name: Hydro-Québec Open Data Search API v1
  description: The legacy Opendatasoft Search API v1 still served on the Hydro-Québec open
    data portal. Verified live and anonymous on 2026-07-27 — GET /api/datasets/1.0/search/
    returned HTTP 200 with all 26 datasets. Documented through the portal's interactive v1
    API console. Hydro-Québec publishes no OpenAPI or Swagger description for this version
    (/api/v1/swagger.json returns HTTP 404), so no machine-readable contract was harvested
    for it.
  humanURL: https://donnees.hydroquebec.com/api/v1/console
