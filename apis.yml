name: Hydro-Québec
kind: company
description: Hydro-Québec is the government-owned Crown corporation that generates, transmits
  and distributes almost all of the electricity consumed in Québec, Canada — a vertically
  integrated, near-monopoly utility running one of the largest hydroelectric fleets in the
  world and serving roughly 4.6 million customer accounts across the province. It sits at
  every point of the value chain at once, as generator, transmission owner, distributor and
  retailer, plus a cross-border exporter into the New England and New York markets. Its API
  posture is a clean split. Market and grid data is genuinely open — a public Opendatasoft-powered
  portal at donnees.hydroquebec.com serves 26 datasets (electricity demand and generation,
  imports and exports, outages, GHG emission factors, hydrometric and weather data, winter
  peak demand events, vegetation control) through a documented, anonymously callable REST
  API with a machine-readable OpenAPI 3.0.3 description and a DCAT catalog export, licensed
  CC BY-NC 4.0. Consumer data is closed — there is no documented customer-facing API, no Green
  Button Download My Data or Connect My Data service, and no third-party consent flow; a customer's
  own usage is reachable only by logging into the Espace client web portal. Québec has no
  consumer energy data right. Ontario's Green Button regulation (O. Reg. 633/21 under the
  Electricity Act, 1998) is province-specific and does not bind Hydro-Québec, and Canada has
  no national equivalent to Australia's Consumer Data Right energy regime. Open market data,
  closed consumer data, no mandate.
