apis:
- aid: hydro-quebec:hydro-quebec-open-data-explore-api-v2-1
  name: Hydro-Québec Open Data Explore API v2.1
  description: Read-only REST API over Hydro-Québec's 26 public open datasets — catalog search,
    dataset metadata, record query with the Opendatasoft Query Language (ODSQL), facets, attachments,
    and bulk exports to CSV, Parquet, GPX and DCAT. Covers Québec electricity demand and generation,
    imports and exports, ongoing outages and planned service interruptions, direct GHG emission
    factors, hydrometric and weather history, winter peak demand events, and vegetation control
    planning. Verified callable anonymously with no API key (HTTP 200, 26 datasets returned,
    2026-07-27); an optional apikey query parameter is supported for authenticated requests.
    Data is licensed CC BY-NC 4.0 (attribution, non-commercial). Market and grid data only
    — no individual customer consumption is exposed.
  humanURL: https://donnees.hydroquebec.com/api/v2/console
  baseURL: https://donnees.hydroquebec.com/api/explore/v2.1
