  cors_exposed: true
  returned_on: every response, including 2xx
rate_limits:
- name: domain daily quota
  scope: domain
  limit_count: 99999999999999999999999
  limit_interval: day
  reset: midnight UTC
  applies_to: anonymous and authenticated callers on donnees.hydroquebec.com
  observed: '2026-07-27'
  note: >-
    Effectively unlimited as configured. The header is a real, live value, not a documented policy
