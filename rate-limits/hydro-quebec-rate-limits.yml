note: >-
  Hydro-Québec publishes no rate-limit policy page. The API does signal quota state on every
  response, and the observed values were read directly off the wire. The domain limit returned is
  a 23-digit sentinel (99999999999999999999999), i.e. the portal is configured with no practical
  daily cap for anonymous callers — recorded here as observed rather than interpreted as a
  guarantee.
