- name: per-dataset quota
  scope: dataset
  limit_count: null
  limit_interval: day
  applies_to: individual datasets when the portal administrator configures one
  observed: not enforced on the endpoints probed
exceeded:
  status: 429
  body_fields: [errorcode, reset_time, limit_time_unit, call_limit, error]
  errorcode: 10002
  example_message: Too many requests on the domain. Please contact the domain administrator.
  detail: errors/hydro-quebec-problem-types.yml
record_limits:
  records_endpoint_capped: true
  exports_endpoint_capped: false
  note: >-
    Separate from call quota, the records endpoint caps the number of records a single query
    returns while the exports endpoints are documented as having no limitation. Bulk pulls of the
    large Hydro-Québec datasets should use exports rather than paging.
