    scope: domain
    meaning: Total API calls allowed in a single day.
    observed: '99999999999999999999999'
  - name: X-RateLimit-Remaining
    scope: domain
    meaning: Calls remaining until reset.
    observed: '99999999999999999999990'
  - name: X-RateLimit-Reset
    scope: domain
    meaning: Timestamp at which the counter resets.
    observed: '2026-07-28 00:00:00+00:00'
    format: 'YYYY-MM-DD HH:MM:SS+00:00 — not epoch seconds, not an HTTP-date'
  - name: X-RateLimit-dataset-Limit
    scope: dataset
