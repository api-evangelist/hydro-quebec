- id: ieee-2030.5
  conforms: false
  evidence: No smart energy profile / IEEE 2030.5 surface published.
- id: asyncapi
  conforms: false
  evidence: >-
    No event, streaming or webhook surface. Event-shaped datasets (pannes-interruptions,
    evenements-pointe) are polled through the same GET record endpoints.
- id: graphql
  conforms: false
  evidence: No /graphql endpoint on donnees.hydroquebec.com or the Opendatasoft platform.
- id: grpc
  conforms: false
  evidence: No published .proto; nothing on buf.build or the (empty) Hydro-Quebec GitHub org.
- id: json-api
  conforms: false
  evidence: Responses are plain JSON with a links array, not JSON:API media type or document structure.
- id: pagination
  conforms: true
  evidence: >-
    limit and offset parameters declared in components.parameters and applied to getDatasets,
    getRecords and the facet operations. Offset pagination.
- id: idempotency
  conforms: true
  evidence: >-
    "Only the HTTP GET method is supported" (spec info.description). All 16 operations are safe
    and idempotent by HTTP semantics. No idempotency-key contract exists because there are no
    write operations.
- id: rate-limit-headers
  conforms: true
  evidence: >-
    X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset and the per-dataset variants
    returned on every response and exposed via CORS. Not the RFC 9331 draft spelling.
