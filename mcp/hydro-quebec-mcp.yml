    properties:
      dataset_id:
        type: string
      q:
        type: string
      where:
        type: string
      select:
        type: string
      group_by:
        type: string
      order_by:
        type: string
      limit:
        type: number
      offset:
        type: number
      instance:
        type: string
  read_only: true
  source_operation: openapi/hydro-quebec-open-data-explore-api-v2-1-openapi.json#getRecords
- name: facets
  description: Retrieve distinct values and counts for a named facet field within an Opendatasoft dataset;
    useful for enumerating categories or filtering options before querying records.
  title: Facets
  input_schema:
    type: object
    required:
    - dataset_id
    - facet
    properties:
      dataset_id:
        type: string
      facet:
        type: string
      instance:
        type: string
  read_only: true
  source_operation: openapi/hydro-quebec-open-data-explore-api-v2-1-openapi.json#getRecordsFacets
- name: instance_info
  description: Fetch catalog-level metadata for an Opendatasoft portal instance (total dataset count,
    themes, languages); defaults to public.opendatasoft.com.
  title: Instance Info
  input_schema:
    type: object
    properties:
      instance:
        type: string
  read_only: true
  source_operation: openapi/hydro-quebec-open-data-explore-api-v2-1-openapi.json#getDatasetsFacets
