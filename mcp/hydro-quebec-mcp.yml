- name: ask_pipeworx_grounded
  description: Hallucination-resistant answer mode for high-stakes reads. Same routing as ask_pipeworx
    — picks the right tool from 7,019 across 1849 sources, fills arguments, fetches the data — then EXTRACTS
    the answer using ONLY what the tool result contains. Returns {answer, evidence (verbatim quote), confidence,
    source, fetched_at, refusal_reason:null} on success, OR an explicit refusal {answer:null, refusal_reason:"not_in_source"|"no_tool_match"|"tool_error"|"data_truncated"|"llm_error"}
    when the data doesn't directly answer. Use whenever an answer will be quoted, cited, or acted on,
    and the agent must not invent facts (financial verdicts, legal claims, medical lookups, public statements).
    Costs one extra LLM call vs ask_pipeworx — prefer ask_pipeworx for casual lookups.
- name: search_within
  description: 'Semantic search INSIDE a fetched record. Pass the text you already pulled (e.g. a SEC
    10-K body, an article, a long tool result) plus a natural-language query; get back the top-N passages
    with character offsets and similarity scores. Use when the record is too big to cram into the prompt
    — search_within saves context, returns only the passages that matter, and every passage carries an
    offset so the agent can verify a verbatim quote. Pairs with ask_pipeworx_grounded: fetch with the
    gateway, ground over the relevant passages instead of the whole document. BGE-base-en embeddings +
    cosine over 500-char overlapping windows; cap is 200K chars (longer inputs are truncated and flagged).'
- name: deep_research
  description: 'ACCOUNT REQUIRED (free — sign in via GitHub at https://pipeworx.io/signup; depth:"thorough"
    needs a paid plan). If you are not signed in, use ask_pipeworx instead — it works on every tier. Grounded
    multi-source research across Pipeworx''s 1849 STRUCTURED data sources (SEC filings, FRED/BLS economics,
    FDA, USPTO patents, markets, science, government records, etc.) in ONE call — this is NOT open-web
    search. Decomposes your question into focused facets, routes each to the right one of 7,019 tools
    IN PARALLEL, and returns a findings packet: verbatim evidence + confidence + source + fetched_at +
    a stable pipeworx:// citation per finding, with explicit gaps[] for facets the data couldn''t answer
    (never invented). Best for broad/multi-part questions over structured data ("compare X and Y''s regulatory
    + financial exposure", "research the filings + market picture for ACME"). For a single lookup use
    ask_pipeworx (one LLM call, not many). For BREAKING or colloquial CURRENT-NEWS / "what''s the world
    saying about X" topics, prefer ask_pipeworx — it routes to live news APIs and the *-news-feeds packs;
    deep_research returns mostly empty gaps[] when the topic isn''t in the structured catalog. Second-hop
    iteration: depth:"standard" re-angles unanswered gaps (gap recovery); depth:"thorough" additionally
    chases the best leads from the first pass — so multi-step questions resolve in one call. Every finding
    carries a `hop` field and a citation_uri — a resolvable pipeworx:// record URI, present only when
    the source emits one that resources/read can actually serve, so a citation you get back is always
    fetchable. "standard" and "thorough" also return contradictions[] flagging findings that disagree.
    Large records are semantically excerpted to the passages relevant to each facet (not head-truncated),
