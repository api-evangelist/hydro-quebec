- name: resolve_entity
  description: '"What''s the ticker for…" / "find the CIK for…" / "what''s the LEI for…" / "what''s the
    RxCUI for…" / "look up the ID for…" / "what is X''s official identifier" / "who owns X" / "is X a
    subsidiary of Y" — resolve a user-spoken NAME to the canonical/official identifiers other tools require
    as input. Use FIRST whenever you have a name but need an ID. SUPPORTED TYPES: "company" (cross-source
    identity spine: 10-digit CIK + ticker + company_name from SEC EDGAR, legal-entity LEI from GLEIF with
    parent/ultimate-parent/children ownership when the LEI resolves, and security FIGI from OpenFIGI —
    by exact ticker map when a ticker is implied, and otherwise by name search, so NON-EQUITY instruments
    that never have a ticker (municipal and corporate bonds, notes, authority debt) DO resolve here; when
    a name matches more than one instrument it asserts nothing and returns `figi_candidates` to pick from,
    which is the correct answer to an issuer name that does not identify a single bond; every identifier
    is labelled with the source that established it, and an identifier that could NOT be resolved is stated
    explicitly under `unresolved` rather than omitted — accepts ticker, CIK, ISIN, or company name as
    input; an ISIN like "CH0038863350" resolves to the LEGAL ENTITY that issued the security via the GLEIF
    ISIN-to-LEI mapping, covering non-US issuers EDGAR cannot reach), "drug" (returns RxCUI + ingredient
    + brand from RxNorm + pipeworx://rxnorm/concept/{rxcui} citation; accepts brand or generic name).
    LEI/FIGI enrichment degrades gracefully — if GLEIF or OpenFIGI is unavailable, the EDGAR identifiers
    still return. Each call cascades through several lookup endpoints internally — using resolve_entity
    replaces 2-3 manual lookups.'
- name: compare_entities
  description: '"Compare X and Y" / "X vs Y" / "X versus Y" / "which is bigger / better / larger / more
