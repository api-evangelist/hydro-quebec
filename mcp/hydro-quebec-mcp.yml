- name: entity_profile
  description: '"Tell me about X" / "research Acme" / "brief me on Tesla" / "what does Apple do" / "company
    profile for Microsoft" / "give me the rundown on NVDA" / "everything you know about $TICKER" — full
    cross-source profile of a US public company in ONE parallel call. ALWAYS PREFER over chaining single-pack
    SEC/XBRL/news lookups when the user asks for a holistic view. Fans out across SEC EDGAR, XBRL, USPTO
    patents, federal contracts (USAspending), FDA-licensed biologics (Purple Book), H-1B hiring (DOL LCA),
    news and GLEIF, and returns: cik + company_name (+ resolved_from/resolved_to when `value` was a name);
    recent_filings (up to 5 with pipeworx://edgar/company/{cik}/filings/{accession} URIs); fundamentals
    (the latest ANNUAL Revenues, NetIncomeLoss, Cash, diluted EPS, capex and operating cash flow, each
    with its period_end, SEC form and the accession of the filing it came from — plus EntityCommonStockSharesOutstanding,
    which is the newest COVER-PAGE share count the filer has published rather than an annual one, so its
    period_end is a cover date after the quarter closed and it is the right per-share denominator; a filer
    tagging a fallback concept appears under the name of that tag instead, e.g. PaymentsToAcquireProductiveAssets
    instead of PaymentsToAcquirePropertyPlantAndEquipment); patents (USPTO PatentsView API sunset May
    2025 — soft-fails until reactivated); federal_contracts (USAspending awards where the company is the
    recipient); fda_products (FDA-licensed biologics — vaccines, cell/gene therapies — from the Purple
    Book; a company with only small-molecule/generic drugs will show none here, that is expected, not
    a failure); hiring (H-1B sponsorship volume + salary range from DOL LCA filings); recent news mentions
    via GDELT→GNews fallback; LEI via GLEIF. `sources_used` / `sources_failed` say which of these actually
    returned data for THIS company — an empty section is a real "no data", not a bug. `sources_skipped`
    is the third state: a leg we deliberately did NOT run, each entry carrying a `reason` token and a
    plain-English `detail` (the Purple Book is skipped for a filer SEC classifies outside the life-science
    SIC bands, since it lists only 351(a)/(k) biologics licence holders). Pass a ticker ("AAPL"), zero-padded
    CIK ("0000320193"), OR a company name ("Moderna") — names now resolve via SEC EDGAR''s company-name
    match; a private company (no CIK/ticker) returns resolved:false with an explicit `notes` line, not
    a bare failure. `type` accepts "company" or "ticker" interchangeably — both take the same `value`
    shapes above.'
- name: recent_changes
  description: '"What''s new with X" / "latest on Y" / "what happened to Z this week / month / quarter"
    / "updates on Acme" / "news on Tesla recently" / "what''s happening with Apple" — change feed for
    a company in the last N days/weeks/months in ONE parallel call. Fans out to SEC EDGAR (filings since
