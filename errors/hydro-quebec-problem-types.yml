  detail: >-
    Observed verbatim — "ODSQL syntax exception: unexpected ( at position 5 in bogus(. Clause(s)
    containing the error(s): where." The message names the offending position and clause.
  remediation: Correct the syntax at the reported position in the reported clause.
  evidence: live probe 2026-07-27, GET /catalog/datasets?where=bogus(
  source_operation: openapi/hydro-quebec-open-data-explore-api-v2-1-openapi.json#getDatasets
- status: 404
  error_code: NotFoundResource
  title: The requested resource does not exist
  detail: >-
    Observed verbatim — "The requested dataset nonexistent-dataset-xyz does not exist." Returned
    when a {dataset_id} or {record_id} path parameter names something that is not in the catalog.
  remediation: >-
    List the catalog with getDatasets and use a dataset_id from the results. Hydro-Québec publishes
    26 datasets.
  evidence: live probe 2026-07-27, GET /catalog/datasets/nonexistent-dataset-xyz
  source_operation: openapi/hydro-quebec-open-data-explore-api-v2-1-openapi.json#getDataset
  note: >-
    404 is NOT declared on any operation in either harvested spec — a real gap between the
    published contract and observed behaviour.
- status: 404
  error_code: NotFoundURI
  title: The requested URI does not exist
  detail: >-
    Observed verbatim — "The requested URI does not exist." Returned for an unrouted path under
    the API prefix, e.g. /api/v1/swagger.json and /api/explore/v2.1/openapi.json.
  remediation: Check the path against the OpenAPI description; only the 16 documented paths route.
  evidence: live probe 2026-07-27
  source_operation: null
  note: Also undeclared in the specs.
- status: 401
  error_code: null
  title: Unauthorized
  detail: >-
    Declared inline on all 16 operations with the bare description "Unauthorized". The platform
    documents it as the response when accessing a private portal's catalog unauthenticated. The
    Hydro-Québec portal is public, so anonymous calls return 200; 401 was not reproducible.
  remediation: >-
    Supply an API key as "Authorization: Apikey <key>" or ?apikey=<key>. Not required for
    Hydro-Québec's public datasets.
  source_operation: all 16 operations
- status: 429
  error_code: '10002'
  title: Too many requests
  detail: >-
    Domain-level quota exceeded. The body reports call_limit, limit_time_unit and reset_time.
    Rate-limit state is also returned on every 2xx response in X-RateLimit-* headers.
  remediation: >-
    Read X-RateLimit-Remaining and X-RateLimit-Reset before retrying, and back off until the reset
    timestamp. Prefer the exports endpoints over paging the records endpoint for bulk pulls.
  evidence: components.responses.quota.examples.quota_exceeded
  source_operation: all 16 operations
- status: 500
  error_code: null
  title: Internal Server Error
  detail: Declared inline on all 16 operations with the bare description "Internal Server Error".
  remediation: Retry — all operations are GET and therefore safe to retry. Escalate to the Open Data team if persistent.
  source_operation: all 16 operations
