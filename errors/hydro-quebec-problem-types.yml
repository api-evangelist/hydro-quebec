format: proprietary
note: >-
  Not RFC 9457. The Explore API returns a two-field JSON envelope on 4xx errors, served as
  application/json; charset=utf-8. Every one of the 16 operations declares the same
  400/401/429/500 response set, so the catalog below is API-wide rather than per-operation.
  The 429 body uses a different, numeric envelope.
envelopes:
- name: error
  applies_to: [400, 404]
  media_type: application/json; charset=utf-8
  schema:
    type: object
    required: [message, error_code]
    properties:
      error_code: {type: string}
      message: {type: string}
  example:
    error_code: ODSQLError
    message: 'ODSQL query is malformed: invalid_function() Clause(s) containing the error(s): select.'
- name: quota
  applies_to: [429]
  media_type: application/json; charset=utf-8
  schema:
    type: object
    required: [errorcode, reset_time, limit_time_unit, call_limit, error]
    properties:
      errorcode: {type: number}
      reset_time: {type: string}
      limit_time_unit: {type: string}
      call_limit: {type: number}
      error: {type: string}
  example:
    errorcode: 10002
    reset_time: '2021-01-26T00:00:00Z'
    limit_time_unit: day
    call_limit: 10000
    error: Too many requests on the domain. Please contact the domain administrator.
