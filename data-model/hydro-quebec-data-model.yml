id_conventions:
  dataset_id: >-
    Human-readable slug, French-language, kebab-case. Examples from the live catalog —
    historique-demande-electricite-quebec, pannes-interruptions, facteurges,
    calendrier-travaux-degagement-distribution-shap.
  dataset_uid: Opaque platform identifier, readOnly.
  record_id: Opaque per-record identifier returned as _id.
  note: >-
    No prefixed or typed ids. The dataset_id slug encodes format suffixes (-json, -shap) and
    granularity suffixes (-ra-mois, -mrc-mois, -mun-mois) by convention rather than by contract.
